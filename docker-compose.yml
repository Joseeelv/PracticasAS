services:
  debian_rooter:
    image: debian:latest
    container_name: debian_rooter
    command: bash -c "apt-get update &&
                      apt-get install -y iputils-ping net-tools dnsutils nano &&
                      tail -f /dev/null"
    networks:
      svc_net:
        ipv4_address: 172.20.0.10
      prod_net:
        ipv4_address: 172.30.0.10
      dev_net:
        ipv4_address: 172.40.0.10

  # PHP-FPM para PostgreSQL
  # web_pgsql_php:
  #   build: ./services/web_pgsql
  #   container_name: web_pgsql_php
  #   volumes:
  #     - ./services/web_pgsql/public:/var/www/html
  #     - ./services/web_pgsql/php-fpm.conf:/usr/local/etc/php-fpm.conf
  #   networks: 
  #     prod_net:
  #       ipv4_address: 172.30.0.2
  
  # Servidor Nginx para Drupal
  # nginx:
  #   image: nginx:latest
  #   container_name: nginx
  #   depends_on:
  #     - web_pgsql_php
  #   volumes:
  #     - ./services/web_pgsql/public:/var/www/html
  #     - ./services/web_pgsql/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   ports:
  #     - "8080:80"
  #   networks:
  #     prod_net:
  #       ipv4_address: 172.30.0.4

  # Base de datos PostgreSQL
  db:
    image: postgres:13
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
    volumes:
      - ./services/web_pgsql/sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks: 
      prod_net:
        ipv4_address: 172.30.0.3

  # Web con Apache y MySQL
  web_mysql:
    build: ./services/web_mysql
    container_name: web_mysql
    depends_on:
      - db2
    ports:
      - "8081:80"
    environment:
      MYSQL_HOST: db2
      MYSQL_USER: example
      MYSQL_PASSWORD: example
      MYSQL_DATABASE: example
    volumes:
      - ./services/web_mysql/public:/var/www/html
    networks: 
      dev_net:
        ipv4_address: 172.40.0.2

  # Base de datos MySQL
  db2:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: example
      MYSQL_USER: example
      MYSQL_PASSWORD: example
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - ./services/web_mysql/sql:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    networks:
      dev_net:
        ipv4_address: 172.40.0.3

  dns:
    image: debian:latest
    container_name: dns
    command: bash -c "apt-get update &&
             apt-get install -y bind9 &&
             apt-get install -y systemctl net-tools nano dnsutils lsof nmap &&
             cp /etc/bind/named.conf.options2 /etc/bind/named.conf.options &&
             cp /etc/bind/named.conf.local2 /etc/bind/named.conf.local &&
             cp /etc/resolv2.conf /etc/resolv.conf &&
             systemctl start bind9"
    volumes:
      - ./conf/named.conf.options:/etc/bind/named.conf.options2
      - ./conf/named.conf.local:/etc/bind/named.conf.local2
      - ./conf/prod.local:/etc/bind/prod.local
      - ./conf/resolv.conf:/etc/resolv2.conf
    networks:
      svc_net:
        ipv4_address: 172.20.0.2

  sshServices:
    image: debian:latest
    restart: always
    container_name: sshServices
    environment:
      - USER=john_doe_svc
      - PASSWORD=john_doe_svc
    ports:
      - "2222:22"
    volumes:
      - ./ssh_keys:/home/john_doe_svc/.ssh
    networks:
      - svc_net
    command: bash -c "
        apt-get update &&
        apt-get install -y nano openssh-server iproute2 &&
        useradd -m -s /bin/bash john_doe_svc &&
        echo 'john_doe_svc:john_doe_svc' | chpasswd &&
        mkdir -p /run/sshd &&
        chmod 700 /home/john_doe_svc/.ssh &&
        chown -R john_doe_svc:john_doe_svc /home/john_doe_svc/.ssh &&
        touch /home/john_doe_svc/.bash_history &&
        echo 'PasswordAuthentication no' >> /etc/ssh/sshd_config &&
        echo 'PubkeyAuthentication yes' >> /etc/ssh/sshd_config &&
        /usr/sbin/sshd -D "

networks:
  svc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  prod_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  dev_net:
    ipam:
      config:
        - subnet: 172.40.0.0/24
